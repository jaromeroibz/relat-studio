[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "24"

# Hashed assets are immutable; everything else is revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# No catch-all redirect on purpose.
#
# Every route is prerendered to a real file, so deep links resolve without one.
# A `/*` → `/index.html` rule with status 200 would answer every mistyped or
# retired URL with the homepage and a success status — a soft 404, which tells
# crawlers the page exists. Netlify serves 404.html (written by
# scripts/postbuild.mjs) for unmatched paths instead, with a real 404.
