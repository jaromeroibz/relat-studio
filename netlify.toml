[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "24"

# Hashed assets are immutable; everything else is revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Prerendered routes are real files and are served directly. This fallback only
# catches client-side navigation to paths without a prerendered document.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
